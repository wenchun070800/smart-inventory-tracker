apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: inventory-edge
  labels:
    app: inventory-edge
spec:
  selector:
    matchLabels:
      app: inventory-edge
  template:
    metadata:
      labels:
        app: inventory-edge
    spec:
      containers:
        - name: edge-agent
          image: your-registry/inventory-edge:latest
          env:
            - name: BACKEND_URL
              value: "http://inventory-backend:8000/api/detections"
            - name: DEVICE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: MODEL_PATH
              value: "/models/model.tflite"
