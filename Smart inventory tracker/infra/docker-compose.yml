version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inventory
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build:
      context: ../backend
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/inventory
      CELERY_BROKER: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ../backend/app:/app/app

  celery:
    build:
      context: ../backend
    command: celery -A app.tasks.celery worker --loglevel=info
    depends_on:
      - backend
      - redis

  frontend:
    build:
      context: ../frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  edge:
    build:
      context: ../edge
    depends_on:
      - backend
    environment:
      EDGE_DEVICE_ID: edge-local

volumes:
  db_data:
