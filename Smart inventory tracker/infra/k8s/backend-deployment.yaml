apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-backend
  labels:
    app: inventory-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-backend
  template:
    metadata:
      labels:
        app: inventory-backend
    spec:
      containers:
        - name: backend
          image: your-registry/inventory-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: "postgresql://postgres:postgres@db:5432/inventory"
            - name: CELERY_BROKER
              value: "redis://redis:6379/0"
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-backend
spec:
  selector:
    app: inventory-backend
  ports:
    - port: 8000
      targetPort: 8000