apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-backend
  labels:
    app: inventory-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: inventory-backend
    spec:
      serviceAccountName: inventory-backend-sa
      containers:
        - name: backend
          image: your-registry/inventory-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: inventory-secrets
                  key: DATABASE_URL
            - name: CELERY_BROKER
              valueFrom:
                secretKeyRef:
                  name: inventory-secrets
                  key: CELERY_BROKER
            - name: EDGE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: inventory-secrets
                  key: EDGE_API_KEY
            - name: LOG_LEVEL
              value: "INFO"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 8
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 3
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
      volumes:
